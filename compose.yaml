services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pearlhub_dev}
      POSTGRES_USER: ${POSTGRES_USER:-pearlhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pearlhub_dev_only}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pearlhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pearlhub} -d ${POSTGRES_DB:-pearlhub_dev}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pearlhub-postgres-data: