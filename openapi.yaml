openapi: 3.1.0
info:
  title: PearlHub API
  version: 1.0.0
  description: >-
    PearlHub's API uses Artifact as its resource name. Pearl is the product
    concept. The API supports Artifact creation and visibility-safe discovery.
paths:
  /api/v1/artifacts:
    get:
      tags:
        - Artifacts
      summary: Discover Artifacts
      description: >-
        Lists active Artifacts visible to the caller. Anonymous callers receive
        public Artifacts. Authenticated owners may also receive their own
        private Artifacts; unlisted Artifacts are excluded unless explicitly
        requested by their owner. Visibility filters never grant access.
      operationId: listArtifacts
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: >-
            Case-insensitive literal substring match against name or slug.
            Leading and trailing whitespace is trimmed.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: tag
          in: query
          description: >-
            Repeat for multiple tags; all supplied tags must match. Values are
            trimmed and lowercased; duplicates after normalization are rejected.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor bound to the filters, caller, sort, direction, and limit.
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: sort
          in: query
          description: Name ordering is case-insensitive.
          required: false
          schema:
            type: string
            enum: [createdAt, updatedAt, name]
            default: createdAt
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: visibility
          in: query
          description: Narrows results and never bypasses caller authorization.
          required: false
          schema:
            type: string
            enum: [public, unlisted, private]
      responses:
        "200":
          description: Artifacts matching the discovery filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDiscoveryPage"
        "400":
          description: Malformed or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Discovery is unavailable until its index has been built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Artifacts
      summary: Create an Artifact
      description: Creates an Artifact owned by the authenticated internal user.
      operationId: createArtifact
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Malformed or invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The owner already has an Artifact with this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateArtifactRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
        - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Leading and trailing whitespace is trimmed before validation.
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum:
            - private
            - unlisted
            - public
    Artifact:
      type: object
      required:
        - id
        - ownerId
        - name
        - slug
        - visibility
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
        ownerId:
          type: string
          readOnly: true
          description: Derived from the authenticated principal, never from the request body.
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        visibility:
          type: string
          enum:
            - private
            - unlisted
            - public
        status:
          type: string
          enum:
            - active
            - tombstone
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - visibility
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        visibility:
          type: string
          enum: [private, unlisted, public]
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            maxLength: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactDiscoveryPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactSummary"
        nextCursor:
          type: [string, "null"]
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              description: Stable machine-readable UPPER_SNAKE_CASE code.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
