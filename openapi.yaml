openapi: 3.1.0
info:
  title: PearlHub API
  version: 1.0.0
  description: >-
    PearlHub's API uses Artifact as its resource name. Pearl is the product
    concept. First publication creates the Artifact and immutable 0.1.0
    version atomically from an owner-authorized Draft. Drafts and published
    snapshots are stored in PostgreSQL.
paths:
  /api/v1/artifacts:
    get:
      tags:
        - Artifacts
      summary: Discover Artifacts
      description: >-
        Lists active Artifacts visible to the caller. Anonymous callers receive
        public Artifacts. Authenticated owners may also receive their own
        private Artifacts; unlisted Artifacts are excluded unless explicitly
        requested by their owner. Visibility filters never grant access.
      operationId: listArtifacts
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: >-
            Case-insensitive literal substring match against name or slug.
            Leading and trailing whitespace is trimmed.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: tag
          in: query
          description: >-
            Repeat for multiple tags; all supplied tags must match. Values are
            trimmed and lowercased; duplicates after normalization are rejected.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor bound to the filters, caller, sort, direction, and limit.
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: sort
          in: query
          description: Name ordering is case-insensitive.
          required: false
          schema:
            type: string
            enum: [createdAt, updatedAt, name]
            default: createdAt
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: visibility
          in: query
          description: Narrows results and never bypasses caller authorization.
          required: false
          schema:
            type: string
            enum: [public, unlisted, private]
      responses:
        "200":
          description: Artifacts matching the discovery filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDiscoveryPage"
        "400":
          description: Malformed or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Discovery is unavailable until its index has been built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Artifacts
      summary: Create an Artifact (retired)
      description: >-
        Retired. Create a Draft and publish it to create its Artifact identity
        and first version in one transaction.
      operationId: createArtifact
      deprecated: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "410":
          description: Use the Draft and Publish workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Malformed or invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The owner already has an Artifact with this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}:
    get:
      tags: [Artifacts]
      summary: Read a visible Artifact
      description: >-
        Returns canonical metadata for an active Artifact. Public Artifacts are
        readable anonymously. Private and unlisted Artifacts require owner
        authorization. Tombstoned Artifacts return 410.
      operationId: getArtifact
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Canonical metadata for an active Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Invalid Artifact identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated caller cannot read this Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Artifact was not found or is not visible to an anonymous caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [Artifacts]
      summary: Tombstone an Artifact
      description: >-
        Atomically marks the Artifact tombstone/unlisted and retains its
        immutable snapshot, Versions, lineage, provenance, and references.
      operationId: deleteArtifact
      security:
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Artifact tombstoned; historical records are retained.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller cannot delete this Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Artifact was never found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has already been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}/lineage:
    get:
      tags: [Lineage]
      summary: Read visible Fork lineage
      description: >-
        Returns persisted parent and child Fork relationships. Related Artifacts
        are included only when readable by the caller; hidden edges and hidden
        edge counts are omitted.
      operationId: getArtifactLineage
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Visible persisted Fork relationships, or empty collections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactLineage"
        "400":
          description: Invalid Artifact identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated caller cannot read this Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Artifact was not found or is not visible to an anonymous caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}/fork:
    post:
      tags: [Forks]
      summary: Create a Fork Draft
      description: >-
        Copies the explicitly selected immutable Version into a private Draft.
        First publication creates the new Artifact, 0.1.0 Version, and permanent
        lineage atomically.
      operationId: createForkDraft
      security:
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceVersion, name, slug, visibility]
              properties:
                sourceVersion:
                  type: string
                  maxLength: 128
                  description: Exact source SemVer; the latest Version is never substituted.
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                visibility:
                  type: string
                  enum: [private, unlisted, public]
      responses:
        "201":
          description: Editable Draft copied from the selected Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid request or unusable source content snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller cannot read the source Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Source Artifact or Version was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Source Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/imports/github:
    post:
      tags: [Imports]
      summary: Create an Import Draft
      description: >-
        Accepts pasted Markdown/Skill content or a raw.githubusercontent.com
        source URL. Returns an editable Draft; publication is a separate
        operation. GitHub fetching is HTTPS-only, allowlisted, redirect-free,
        timeout-bound, and limited to 1 MiB.
      operationId: createImportDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: Editable Import Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid input, unsupported URL, or invalid content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: GitHub source could not be retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: GitHub source request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/drafts:
    get:
      tags: [Drafts]
      summary: List the caller's active Drafts
      operationId: listDrafts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active Draft summaries owned by the authenticated caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftSummary"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags: [Drafts]
      summary: Create a Draft
      operationId: createDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "201":
          description: Private Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid metadata, content, or dependency range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Drafts]
      summary: Read an owner-authorized Draft
      operationId: getDraft
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Draft and current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller does not own this Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Draft was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [Drafts]
      summary: Update a Draft with optimistic concurrency
      description: >-
        For an Artifact work-copy, changing Draft visibility takes effect on
        the Artifact only when the updated Draft revision is published.
      operationId: updateDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DraftInput"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Updated Draft with incremented revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller does not own this Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale revision or Draft is no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [Drafts]
      summary: Discard an unpublished Draft
      operationId: discardDraft
      security:
        - BearerAuth: []
      parameters:
        - name: revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Draft discarded.
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller does not own this Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale revision or Draft is no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/drafts/{draftId}/publish:
    post:
      tags: [Drafts]
      summary: Publish a Draft atomically
      description: >-
        Publishing an Artifact work-copy applies its Draft visibility to the
        Artifact in the same transaction that creates the next immutable
        Version.
      operationId: publishDraft
      security:
        - BearerAuth: []
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Artifact and complete immutable version created or updated in one PostgreSQL transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedVersion"
        "400":
          description: Invalid Draft or dependency declaration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The caller does not own this Draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stale Draft, duplicate slug/version, or active Draft conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: The Artifact associated with this Draft has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}/versions:
    get:
      tags: [Artifact Versions]
      summary: List versions of a visible Artifact
      operationId: listArtifactVersions
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published versions. Drafts are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishedVersion"
        "404":
          description: Artifact is not visible or was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A legacy version has no stored PostgreSQL content snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}/versions/{version}:
    get:
      tags: [Artifact Versions]
      summary: Read a complete published version
      operationId: getArtifactVersion
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete immutable version snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedVersion"
        "404":
          description: Artifact or version is not visible or was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Legacy version has no stored PostgreSQL content snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/artifacts/{artifactId}/versions/{version}/work-copy:
    post:
      tags: [Drafts]
      summary: Create an owner work-copy from a selected version
      operationId: createWorkCopy
      security:
        - BearerAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: New Draft based on the selected immutable version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only the Artifact owner may edit it through a work-copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An active Draft already exists or source content is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Artifact has been tombstoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    DraftContent:
      type: object
      additionalProperties: false
      required: [instructions, knowledgeFiles, dependencies]
      properties:
        instructions:
          type: string
        tags:
          type: array
          maxItems: 10
          description: >-
            Optional search tags retained in the published Version and Artifact
            discovery index. Values are trimmed, lowercased, and validated
            against the Pearl tag rules before persistence.
          items:
            type: string
        knowledgeFiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, content]
            properties:
              path:
                type: string
                description: Normalized relative path; traversal and duplicate paths are rejected.
              content:
                type: string
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [targetArtifactId, declaredRange]
            properties:
              targetArtifactId:
                type: string
              declaredRange:
                type: string
                description: Valid SemVer range retained with the published version.
    DraftInput:
      type: object
      additionalProperties: false
      required: [name, slug, visibility, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum: [private, unlisted, public]
        content:
          $ref: "#/components/schemas/DraftContent"
    Draft:
      type: object
      additionalProperties: false
      required: [id, ownerId, name, slug, visibility, content, artifactId, baseVersionId, forkOrigin, provenance, state, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          readOnly: true
        ownerId:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum: [private, unlisted, public]
        content:
          $ref: "#/components/schemas/DraftContent"
        artifactId:
          type: [string, "null"]
        baseVersionId:
          type: [string, "null"]
        forkOrigin:
          type: [object, "null"]
          additionalProperties: false
          required: [artifactId, versionId]
          properties:
            artifactId:
              type: string
            versionId:
              type: string
        provenance:
          type: [object, "null"]
          additionalProperties: false
          required: [sourceType, sourceUrl, sourceRef, importedAt]
          properties:
            sourceType:
              type: string
            sourceUrl:
              type: string
            sourceRef:
              type: string
            importedAt:
              type: string
              format: date-time
        state:
          type: string
          enum: [active, published, discarded]
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DraftSummary:
      type: object
      additionalProperties: false
      required: [id, artifactId, baseVersionId, name, slug, visibility, state, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
        artifactId:
          type: [string, "null"]
        baseVersionId:
          type: [string, "null"]
        name:
          type: string
        slug:
          type: string
        visibility:
          type: string
          enum: [private, unlisted, public]
        state:
          type: string
          const: active
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
    ImportRequest:
      oneOf:
        - $ref: "#/components/schemas/PastedImportRequest"
        - $ref: "#/components/schemas/GitHubImportRequest"
      discriminator:
        propertyName: sourceType
        mapping:
          pasted: "#/components/schemas/PastedImportRequest"
          github: "#/components/schemas/GitHubImportRequest"
    PastedImportRequest:
      type: object
      additionalProperties: false
      required: [sourceType, name, slug, visibility, content]
      properties:
        sourceType:
          type: string
          const: pasted
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum: [private, unlisted, public]
        content:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Markdown/Skill text, limited to 1 MiB when encoded as UTF-8.
    GitHubImportRequest:
      type: object
      additionalProperties: false
      required: [sourceType, name, slug, visibility, sourceUrl]
      properties:
        sourceType:
          type: string
          const: github
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum: [private, unlisted, public]
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: HTTPS raw.githubusercontent.com URL; redirects and other hosts are rejected.
        updatedAt:
          type: string
          format: date-time
    PublishedVersion:
      type: object
      additionalProperties: false
      required: [artifact, version]
      properties:
        artifact:
          $ref: "#/components/schemas/Artifact"
        version:
          type: object
          additionalProperties: false
          required: [id, artifactId, version, contentHash, publishedAt, content]
          properties:
            id:
              type: string
            artifactId:
              type: string
            version:
              type: string
            contentHash:
              type: string
              pattern: "^sha256:[0-9a-f]{64}$"
            publishedAt:
              type: string
              format: date-time
            content:
              allOf:
                - $ref: "#/components/schemas/DraftContent"
                - type: object
                  properties:
                    knowledgeFiles:
                      type: array
                      items:
                        allOf:
                          - $ref: "#/components/schemas/DraftContent/properties/knowledgeFiles/items"
                          - type: object
                            properties:
                              contentHash:
                                type: string
    CreateArtifactRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
        - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Leading and trailing whitespace is trimmed before validation.
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        visibility:
          type: string
          enum:
            - private
            - unlisted
            - public
    Artifact:
      type: object
      required:
        - id
        - ownerId
        - name
        - slug
        - visibility
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
        ownerId:
          type: string
          readOnly: true
          description: Derived from the authenticated principal, never from the request body.
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        visibility:
          type: string
          enum:
            - private
            - unlisted
            - public
        status:
          type: string
          enum:
            - active
            - tombstone
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactLineage:
      type: object
      additionalProperties: false
      required: [parents, children]
      properties:
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactLineageEntry"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactLineageEntry"
    ArtifactLineageEntry:
      type: object
      additionalProperties: false
      required: [id, parentArtifactId, childArtifactId, sourceVersionId, relationshipType, createdAt, artifact]
      properties:
        id:
          type: string
          description: Persisted PearlHub lineage relationship ID.
        parentArtifactId:
          type: string
        childArtifactId:
          type: string
        sourceVersionId:
          type: [string, "null"]
          description: Exact source Artifact Version ID selected when the Fork Draft was created.
        relationshipType:
          type: string
          const: fork
        createdAt:
          type: string
          format: date-time
        artifact:
          allOf:
            - $ref: "#/components/schemas/Artifact"
          description: Parent Artifact in `parents`; child Artifact in `children`.
    ArtifactSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - visibility
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        visibility:
          type: string
          enum: [private, unlisted, public]
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            maxLength: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtifactDiscoveryPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactSummary"
        nextCursor:
          type: [string, "null"]
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              description: Stable machine-readable UPPER_SNAKE_CASE code.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
